board:
  name: me54bs62
  full_name: Minew ME54BS62
  vendor: minew
  socs:
  - name: nrf54l15
    variants:
    - name: xip
      cpucluster: cpuflpr
runners:
  run_once:
    '--recover':
      - runners:
          - nrfjprog
          - nrfutil
        run: first
        groups:
          - boards:
              - me54bs62/nrf54l15/cpuapp
              - me54bs62/nrf54l15/cpuflpr
              - me54bs62/nrf54l15/cpuflpr/xip
    '--erase':
      - runners:
          - nrfjprog
          - jlink
          - nrfutil
        run: first
        groups:
          - boards:
              - me54bs62/nrf54l15/cpuapp
              - me54bs62/nrf54l15/cpuflpr
              - me54bs62/nrf54l15/cpuflpr/xip
    '--reset':
      - runners:
          - nrfjprog
          - jlink
          - nrfutil
        run: last
        groups:
          - boards:
              - me54bs62/nrf54l15/cpuapp
              - me54bs62/nrf54l15/cpuflpr
              - me54bs62/nrf54l15/cpuflpr/xip