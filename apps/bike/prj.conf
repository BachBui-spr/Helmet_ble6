# ============================================================
#  Bike hub (apps/bike) - trung tam am thanh tren xe
#  Dien thoai --(LE Audio unicast, CIS)--> hub --(Auracast broadcast, BIG)--> nhieu mu
#  Thiet ke: docs/BIKE_HUB_THIET_KE.md
#  Hub KHONG giai ma / ma hoa lai: chuyen nguyen khung LC3 tu CIS sang BIS.
# ============================================================

# ---- Log + shell qua SEGGER RTT (scripts/rtt.sh build/bike) ----
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=256
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2560

# ---- Bluetooth LE co ban ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Bike_Hub"
CONFIG_BT_HCI_ERR_TO_STR=y
# Dien thoai + toi da 2 mu dang ghep cung luc (mu doc Join Info roi ngat ngay) + du phong: moi bo
# quang ba co the ket noi dang chay giu san 1 o bt_conn, nen 3 o la het khi dien thoai + 2 mu.
CONFIG_BT_MAX_CONN=5
CONFIG_BT_CTLR_SDC_PERIPHERAL_COUNT=5
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
# PPCP (dien thoai co doc: do 23/10/2026 no chon 75 ms trong dai cu 62,5-87,5 ms) = 33,75 ms / 6 s,
# trung voi gia tri main.c xin: khong phai boi so 10 ms nen ACL khong khoa pha voi BIG.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=27
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=27
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# Ba bo quang ba mo rong: (1) cho dien thoai; (2) Auracast + PA, cho mu; (3) cua so ghep mu
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=3
CONFIG_BT_PER_ADV=y
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=191

# ---- Bao mat + luu bond / cai dat (phan vung storage, ZMS) ----
CONFIG_BT_SMP=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_MAX_PAIRED=8
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
# Ghi RRAM dong bo voi radio qua MPSL timeslot. Mac dinh bo dem ghi 32 dong (512 B) -> moi lan ghi
# xin 8,1 ms radio TRONG LIEN TUC; BIG 10 ms (chiem ~5 ms) khong bao gio de trong 8,1 ms -> luu bond
# moi (trong thread BT RX) cho toi 24 s, hub ngung tra loi mu (do 20/10/2026). 1 dong (16 B):
# moi lan ghi chi can 0,6 ms, vua khoang trong cua BIG; luu bond ~vai chuc ms.
CONFIG_NRF_RRAM_WRITE_BUFFER_SIZE=1

# ---- GATT ----
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_ATT_PREPARE_COUNT=4
CONFIG_UTF8=y

# ---- Phia dien thoai: BAP Unicast Server, chi chieu NHAN (hub khong co micro) ----
CONFIG_BT_AUDIO=y
CONFIG_BT_ISO_PERIPHERAL=y
CONFIG_BT_BAP_UNICAST_SERVER=y
CONFIG_BT_ASCS=y
CONFIG_BT_ASCS_MAX_ASE_SNK_COUNT=2
CONFIG_BT_ASCS_MAX_ASE_SRC_COUNT=0
CONFIG_BT_PAC_SNK=y
CONFIG_BT_PAC_SNK_LOC=y
CONFIG_BT_CAP_ACCEPTOR=y
# Metadata dien thoai gui kem Enable (contexts + CCID...)
CONFIG_BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE=32
# Khong co VCS: dien thoai tu giam am luong trong du lieu (software volume) truoc khi ma hoa,
# nen thanh am luong tren dien thoai van dieu khien duoc tieng o moi mu.

# ---- Phia mu: BAP Broadcast Source, 1 subgroup: 1 BIS stereo (BIG 20 ms) hoac 2 BIS trai / phai ----
CONFIG_BT_ISO_BROADCASTER=y
# BIG 20 ms, BN 2 tao bang LE Create BIG Test (bcast_source.c); tham so = 0 -> Create BIG thuong
CONFIG_BT_ISO_TEST_PARAMS=y
CONFIG_BT_BAP_BROADCAST_SOURCE=y
CONFIG_BT_BAP_BROADCAST_SRC_STREAM_COUNT=2
CONFIG_BT_BAP_BROADCAST_SRC_SUBGROUP_COUNT=1
CONFIG_BT_ISO_MAX_BIG=1
CONFIG_BT_CTLR_ADV_ISO_STREAM_MAX=2
CONFIG_BT_CTLR_ADV_ISO_STREAM_COUNT=2
# Thoi gian controller CHUA LAI cho vai tro khac trong moi chu ky ISO 10 ms khi chon tham so BIG.
# Mac dinh 1600 us: BIG chiem gan het, ket noi ACL (mu dang ghep, dien thoai) bi bo lot -> ghep
# doi treo 19 s roi mat lien ket 0x08 (do 20/10/2026; tat BIG thi ghep xong trong 1 s).
# 5000 us: BIG gon trong ~5 ms, con ~5 ms cho ACL + CIS nhac tu dien thoai + quang ba.
CONFIG_BT_CTLR_SDC_BIG_RESERVED_TIME_US=5000

# ---- Kenh ISO: toi da 2 CIS tu dien thoai + 2 BIS phat ----
CONFIG_BT_ISO_MAX_CHAN=4
CONFIG_BT_ISO_RX_BUF_COUNT=4
# SDU phat lon nhat: BIS stereo 2 x 120 B = 240 B (toi da 250 B = 1 PDU)
CONFIG_BT_ISO_TX_MTU=251
CONFIG_BT_ISO_TX_BUF_COUNT=6
CONFIG_BT_CTLR_SDC_ISO_TX_HCI_BUFFER_COUNT=6

# ---- LC3: chi de tao san mot khung "im lang" luc khoi dong (khong ma hoa lien tuc) ----
CONFIG_FPU=y
CONFIG_LIBLC3=y

# ---- Nut (gpio-keys -> input), am bao qua loa (I2S20 -> MAX98357A), bat / tat (System OFF) ----
CONFIG_INPUT=y
CONFIG_I2S=y
CONFIG_POWEROFF=y
CONFIG_HWINFO=y
