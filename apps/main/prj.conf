# ============================================================
#  Helmet (apps/main) - tai nghe LE Audio day du:
#  nghe nhac + dam thoai (CIS hai chieu) + nut cu chi + bat/tat + nhiet do
#  Thiet ke: docs/HELMET_THIET_KE_CHUC_NANG_MOI.md
# ============================================================

# ---- Log + shell qua SEGGER RTT (make rtt) va UART20 ----
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=256
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
# Thoi gian CPU that cua tung thread: "helmet cpu" (va "kernel thread list")
CONFIG_THREAD_RUNTIME_STATS=y

# ---- Bluetooth LE co ban ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Helmet_1"
CONFIG_BT_EXT_ADV=y
CONFIG_BT_HCI_ERR_TO_STR=y
CONFIG_BT_SECURITY_ERR_TO_STR=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=50
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=70
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# ---- Bao mat + luu bond / cai dat vao RRAM (phan vung storage, ZMS) ----
CONFIG_BT_SMP=y
# Sua loi turnoff, reset lai khong lien tuc mat ket noi
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_MAX_PAIRED=6
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
# Ghi RRAM dong bo voi radio qua MPSL timeslot. Mac dinh bo dem ghi 32 dong -> moi lan ghi xin
# 8,1 ms radio trong lien tuc; khi dang nghe CIS / BIG (chu ky 10 ms) khong co khoang do -> moi lan
# luu settings bi treo toi 24 s (gap tren hub 20/10/2026). 1 dong (16 B): chi can 0,6 ms moi lan.
CONFIG_NRF_RRAM_WRITE_BUFFER_SIZE=1

# ---- GATT (client cho MCP/TBS, dynamic DB cho dich vu LE Audio) ----
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_GATT_DYNAMIC_DB=y
# Ghi dai (Prepare Write): ASE metadata 64 B va BASS Add Source (metadata subgroup) co the dai
# hon ATT MTU 65 B -> dien thoai chia nhieu goi. ASCS bat buoc du cho gia tri ASE lon nhat.
CONFIG_BT_ATT_PREPARE_COUNT=4
CONFIG_BT_ATT_TX_COUNT=20
CONFIG_UTF8=y

# ---- LE Audio: nghe (2 ASE sink) + noi (1 ASE source) ----
CONFIG_BT_AUDIO=y
CONFIG_BT_ISO_PERIPHERAL=y
# 3 kenh cho dien thoai (ASCS) + 1 CIS hai chieu khi la master intercom
CONFIG_BT_ISO_MAX_CHAN=4
# So SDU gui di toi da nam trong controller: host (phieu theo doi) va controller (o chua)
# PHAI bang nhau, neu khong Zephyr canh bao va mot ben bi phi. 3 = mac dinh cua SDC, du cho
# voice_tx (moi 2 SDU + 1 du phong khi CPU ban luc goi dien), khong lam tang do tre.
CONFIG_BT_ISO_TX_BUF_COUNT=3
CONFIG_BT_CTLR_SDC_ISO_TX_HCI_BUFFER_COUNT=3
CONFIG_BT_BAP_UNICAST_SERVER=y
# Metadata dien thoai gui kem Enable: Streaming Contexts (4 B) + CCID List khi goi dien (3 B)...
# Mac dinh 4 B -> ASCS tu choi Enable (0x0D) va dien thoai thu lai mai, cuoc goi khong co tieng.
# 64 B: metadata subgroup cua broadcast (Program Info, ngon ngu...) trong BASS Add Source / BASE.
CONFIG_BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE=64
# Codec config cua BIS = subgroup (tan so, khung, octet, vi tri) + muc BIS (vi tri): > 19 B mac dinh
CONFIG_BT_AUDIO_CODEC_CFG_MAX_DATA_SIZE=32
CONFIG_BT_ASCS=y
CONFIG_BT_ASCS_MAX_ASE_SNK_COUNT=2
CONFIG_BT_ASCS_MAX_ASE_SRC_COUNT=1
CONFIG_BT_PAC_SNK=y
CONFIG_BT_PAC_SNK_LOC=y
CONFIG_BT_PAC_SRC=y
CONFIG_BT_PAC_SRC_LOC=y
CONFIG_BT_CAP_ACCEPTOR=y
CONFIG_BT_TMAP=y
CONFIG_BT_VCP_VOL_REND=y
CONFIG_BT_MCC=y

# ---- Cuoc goi: CCP / TBS client (chi GTBS) + MICP (tat micro tu dien thoai) ----
CONFIG_BT_CCP_CALL_CONTROL_CLIENT=y
CONFIG_BT_TBS_CLIENT_GTBS=y
CONFIG_BT_TBS_CLIENT_MAX_CALLS=2
CONFIG_BT_TBS_CLIENT_ACCEPT_CALL=y
CONFIG_BT_TBS_CLIENT_TERMINATE_CALL=y
CONFIG_BT_TBS_CLIENT_INCOMING_CALL=y
CONFIG_BT_TBS_CLIENT_CALL_FRIENDLY_NAME=y
# URI cuoc goi (tel:/sip:...) dai hon 30 B (mac dinh) bi bo qua trong danh sach cuoc goi
CONFIG_BT_TBS_MAX_URI_LENGTH=64
CONFIG_BT_MICP_MIC_DEV=y

# ---- LC3 (giai ma + ma hoa, liblc3 dung FPU) + I2S + PDM ----
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_LIBLC3=y
# Giam on (voice_dsp.c): FFT thuc 512 diem arm_rfft_fast_f32 thay FFT phuc tu viet
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_I2S=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# ---- Nut nhan (gpio-keys -> input) ----
CONFIG_INPUT=y

# ---- Nguon: System OFF, nguyen nhan reset, tam dung UART, do VDD ----
CONFIG_POWEROFF=y
CONFIG_HWINFO=y
CONFIG_PM_DEVICE=y
CONFIG_ADC=y

# ---- Cam bien nhiet MLX90632 tren I2C bit-bang (i2c-sensor) ----
CONFIG_I2C=y

# ---- Stack / uu tien ----
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_MAIN_THREAD_PRIORITY=4
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2560

# ---- Intercom mu-mu (docs/HELMET_THIET_KE_INTERCOM.md, ban master/slave chon bang nut) ----
# Mu nao cung co the la master (central + peripheral cho dien thoai) hoac slave (2 peripheral:
# dien thoai + master). Che do Dinh vi (features/nav) them 1 central toi xe -> 4 ket noi: toi da
# 2 peripheral, 2 central (SDC: central = MAX_CONN - PERIPHERAL_COUNT).
CONFIG_BT_CENTRAL=y
CONFIG_BT_MAX_CONN=4
CONFIG_BT_CTLR_SDC_PERIPHERAL_COUNT=2
# Du lieu quang ba khi la slave dang cho (~66 B: LE Audio + Service Data cua HIS)
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=191
# Am thanh mu-mu: master la BAP Unicast Client, 1 CIS hai chieu toi 2 ASE cua slave
CONFIG_BT_ISO_CENTRAL=y
CONFIG_BT_BAP_UNICAST_CLIENT=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_BT_BAP_UNICAST_CLIENT_ASE_SNK_COUNT=2
CONFIG_BT_BAP_UNICAST_CLIENT_ASE_SRC_COUNT=2
CONFIG_BT_BAP_UNICAST_CLIENT_GROUP_COUNT=1
CONFIG_BT_BAP_UNICAST_CLIENT_GROUP_STREAM_COUNT=2

# ---- Auracast: nghe chung nhac tu 1 dien thoai (docs/HELMET_AURACAST.md) ----
# Mu la BAP Broadcast Sink + Scan Delegator (BASS): dien thoai (Broadcast Assistant, "Chia se am
# thanh") chi cho mu luong broadcast can nghe, hoac mu tu quet (Power ngan -> giu Call 2 s).
CONFIG_BT_PER_ADV_SYNC=y
# Nhan thong tin dong bo PA qua ket noi ACL (PAST) tu dien thoai: khong phai tu quet
CONFIG_BT_PER_ADV_SYNC_TRANSFER_RECEIVER=y
CONFIG_BT_ISO_SYNC_RECEIVER=y
CONFIG_BT_BAP_SCAN_DELEGATOR=y
# 2 o Receive State: nguon cu chua bi dien thoai xoa van con cho cho nguon moi
CONFIG_BT_BAP_SCAN_DELEGATOR_RECV_STATE_COUNT=2
CONFIG_BT_BAP_BROADCAST_SINK=y
# Toi da 2 BIS (trai + phai) tu 1 subgroup; BASE co the co 2 subgroup (vd chat luong cao / chuan)
CONFIG_BT_BAP_BROADCAST_SNK_STREAM_COUNT=2
CONFIG_BT_BAP_BASS_MAX_SUBGROUPS=2
# Controller: 2 BIS nhan (mac dinh = BT_ISO_MAX_CHAN = 4 -> phi RAM)
CONFIG_BT_CTLR_SYNC_ISO_STREAM_MAX=2
CONFIG_BT_CTLR_SYNC_ISO_STREAM_COUNT=2
# Bo dem ISO nhan cua host: 2 BIS + CIS cung luc (mac dinh 1)
CONFIG_BT_ISO_RX_BUF_COUNT=4
# Thread bt_rx xu ly them lenh BASS + phan tich BASE (mac dinh 2200 B): du phong stack
CONFIG_BT_RX_STACK_SIZE=2560

# ---- Che do Dinh vi: Channel Sounding (Bluetooth 6.0), docs/HELMET_NAV_DINH_VI.md ----
# CS Inline PCT Transfer (IPT): ben ket noi (central) la khoi tao va tu tinh khoang cach, khong can
# Ranging Service (GATT). Mu do toi xe (mu = initiator, xe = reflector) va mu-mu (mu ma nho hon
# do, mu kia phan xa) -> controller ho tro ca hai vai tro, 2 lien ket co CS cung luc.
CONFIG_BT_CHANNEL_SOUNDING=y
CONFIG_BT_CTLR_SDC_CS_ROLE_BOTH=y
CONFIG_BT_CTLR_SDC_CS_COUNT=2
CONFIG_BT_CTLR_SDC_CS_MAX_ANTENNA_PATHS=1
CONFIG_BT_CTLR_SDC_CS_NUM_ANTENNAS=1
CONFIG_BT_CTLR_SDC_CS_STEP_MODE3=n
CONFIG_BT_CTLR_CHANNEL_SOUNDING_TEST=n
# Bat buoc cho CS enhancements (IPT)
CONFIG_BT_CTLR_EXTENDED_FEAT_SET=y
# Cho phep CS va ACL dung PHY khac nhau
CONFIG_BT_TRANSMIT_POWER_CONTROL=y
# Ket qua subevent rap lai trong host: 1 bo dem cho MOI thu tuc chay song song (mu-mu + mu-xe).
# Mode 2, 1 duong anten: ~8 B / buoc; subevent <= 5 ms (~40 buoc) ~ 350 B -> 1000 B du.
CONFIG_BT_CHANNEL_SOUNDING_REASSEMBLY_BUFFER_CNT=2
CONFIG_BT_CHANNEL_SOUNDING_REASSEMBLY_BUFFER_SIZE=1000
# Uoc luong khoang cach (IFFT). 512 diem: bo nho tam 4 KB (1024 diem: 8 KB)
CONFIG_BT_CS_DE=y
CONFIG_BT_CS_DE_512_NFFT=y
CONFIG_BT_CS_DE_MAX_NUM_ANTENNA_PATHS=1

# ---- CHAN DOAN TAM THOI (19/10/2026): vi sao Samsung khong chia se am thanh toi mu ----
# Log moi lan dien thoai doc / ghi thuoc tinh GATT (gatt_trace.c) + log debug cua BASS.
# Tat ca hai sau khi tim ra nguyen nhan.
CONFIG_BT_GATT_AUTHORIZATION_CUSTOM=y
CONFIG_BT_BAP_SCAN_DELEGATOR_LOG_LEVEL_DBG=y

# ---- Thu vien dung chung lib/ (lop 1-2; module lop tren tu chon module lop duoi) ----
# Dich vu: duong ra loa, chieu len cuoc goi, cu chi nut
CONFIG_ME54_SVC_AUDIO_OUT=y
CONFIG_ME54_SVC_VOICE_TX=y
CONFIG_ME54_SVC_BUTTONS=y
# HAL: LED trang thai, nguon (System OFF, VDD), cam bien nhiet
CONFIG_ME54_HAL_STATUS_LED=y
CONFIG_ME54_HAL_POWER=y
CONFIG_ME54_HAL_MLX90632=y
