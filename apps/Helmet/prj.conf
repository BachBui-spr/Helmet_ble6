# ============================================================
#  Helmet - tai nghe LE Audio (nRF54L15 khong co Bluetooth Classic/A2DP)
#  CAP Acceptor + BAP Unicast Server + TMAP UMR + VCP + MCP client
# ============================================================

# ---- Log + shell qua SEGGER RTT (make rtt) va UART20 ----
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=256
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y

# ---- Bluetooth LE co ban ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Helmet"
CONFIG_BT_EXT_ADV=y
CONFIG_BT_HCI_ERR_TO_STR=y
# Bao PHY cua lien ket (chan doan song: heartbeat "link:" + log khi PHY doi)
CONFIG_BT_USER_PHY_UPDATE=y
# Thong so ket noi uu tien cho LE Audio (theo mau tmap_peripheral)
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=50
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=70
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# ---- Bao mat + luu bond vao RRAM (phan vung storage, ZMS) ----
CONFIG_BT_SMP=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y

# ---- GATT (client can cho MCP, dynamic DB cho dich vu LE Audio) ----
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_ATT_PREPARE_COUNT=1
CONFIG_BT_ATT_TX_COUNT=20
CONFIG_UTF8=y

# ---- LE Audio ----
CONFIG_BT_AUDIO=y
CONFIG_BT_ISO_PERIPHERAL=y
CONFIG_BT_ISO_MAX_CHAN=2
# Helmet chi NHAN ISO (khong gui) -> 1 bo dem ISO TX trong controller, khop voi host
CONFIG_BT_CTLR_SDC_ISO_TX_HCI_BUFFER_COUNT=1
CONFIG_BT_BAP_UNICAST_SERVER=y
CONFIG_BT_ASCS=y
CONFIG_BT_ASCS_MAX_ASE_SNK_COUNT=2
CONFIG_BT_ASCS_MAX_ASE_SRC_COUNT=0
CONFIG_BT_PAC_SNK=y
CONFIG_BT_PAC_SNK_LOC=y
CONFIG_BT_PAC_SRC=n
CONFIG_BT_CAP_ACCEPTOR=y
CONFIG_BT_TMAP=y
CONFIG_BT_VCP_VOL_REND=y
CONFIG_BT_MCC=y

# ---- Giai ma LC3 (liblc3, dung FPU cua Cortex-M33) + I2S ----
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_LIBLC3=y
CONFIG_I2S=y

# ---- Nut nhan (gpio-keys -> input) ----
CONFIG_INPUT=y

# ---- Stack ----
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
