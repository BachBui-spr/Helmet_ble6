# ============================================================
#  ME54BS62 hw_test - kiem tra phan cung truoc khi phat trien
# ============================================================
CONFIG_NCS_SAMPLES_DEFAULTS=y

# ---- Log ----
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096

# ---- SEGGER RTT (log/shell qua J-Link, khong can UART) ----
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
# Bo dem chieu host->chip: du lon de dan ca dong lenh shell
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=256

# ---- Shell: dong thoi tren UART20 va RTT ----
#  Ca 2 backend shell deu nhan log.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_GPIO_SHELL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y

# ---- Thong tin chip / reset ----
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# ---- Nut nhan: gpio-keys -> input subsystem ----
CONFIG_INPUT=y

# ---- I2C bit-bang (MLX90632) ----
CONFIG_I2C=y
CONFIG_I2C_SHELL=y

# ---- Audio: I2S (loa MAX98357A) + PDM (micro IM69D130) ----
CONFIG_I2S=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# In so thuc (%f) trong log/shell
CONFIG_CBPRINTF_FP_SUPPORT=y

# ---- Cam bien nhiet do die (TEMP) ----
CONFIG_SENSOR=y

# ---- Bluetooth LE: quang ba de kiem tra RF/anten ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ME54BS62-Test"
# In ten ma loi HCI/SMP trong log (vd "reason 0x05 BT_HCI_ERR_AUTH_FAIL")
CONFIG_BT_HCI_ERR_TO_STR=y

# Ghep doi (SMP). Ubuntu/BlueZ, Android, iOS thuong yeu cau pair ngay khi ket noi;
# khong co SMP -> "Authentication Failure (0x05)" va ngat sau ~0.3 s.
# Mu khong co man hinh/ban phim -> "Just Works".
CONFIG_BT_SMP=y

# Luu khoa ghep doi (bond) vao RRAM (phan vung storage, he file ZMS) de
# khong mat khi reset - neu mat, lan ket noi sau may tinh/dien thoai bao loi khoa.
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
